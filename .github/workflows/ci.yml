name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci --ignore-scripts

      - name: Run checks
        run: bun run test && bun run test:platform && bun run test:windows-scripts

      - name: Check commit messages
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run test:commits
